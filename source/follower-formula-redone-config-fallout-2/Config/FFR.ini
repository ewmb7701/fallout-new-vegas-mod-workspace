[FFR]

;Controls the amount of Charisma (not affected by temporary buffs) that is required to recruit one companion.
;DEFAULT: 2
iCharismaPerFollower = 2

;Controls the bonus to party size that the Magnetic Personality perk gives.
;If set to 0, the perk will be disabled.
;DEFAULT: 1
iMagneticPersonalityBonus = 1

;Controls the level required to take the Magnetic Personality perk.
;DEFAULT: 16
iMagneticPersonalityLevelRequirement = 6

;Controls if the formula's minimum party limit is 1 instead of 0.
;DEFAULT: 0
bMinimumOneFollower = 0

;Controls if the follower formula uses temporary Charisma (e.g. affected by temporary buffs such as alcohol) to recruit companions.
;DEFAULT: 0
bTemporaryCharisma = 1
