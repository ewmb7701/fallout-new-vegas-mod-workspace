[Appearance]
; Health bar, bracket, and companion name color in 0xRRGGBB hexadecimal format.
; Default blue matches the companion map color. Does not recolor activation stats.
uHealthBarRGB=0x2ECEFF

; Health display modes (label: HP, or DAM for mode 5, beneath WG). Invalid modes fall back to 1.
; 0 = hide the HP label and numeric value (does not hide the HP bar).
; 1 = current health only, e.g. HP 150 (default).
; 2 = current health / maximum health, e.g. HP 150/300.
; 3 = percentage, e.g. HP 50%. Displays HP --% if maximum health is nonpositive.
; 4 = difference from maximum health, e.g. HP -25. Full health displays HP -0.
; 5 = damage taken (missing health) as a positive amount, e.g. DAM 25. Full health displays DAM 0.
;     Modes 4 and 5 use displayed maximum minus displayed current HP, clamped to zero.
; HP and percentages round down, so partial health never rounds up to full.
iHPStatDisplayMode=1
; Weight display modes (label: WG). Invalid modes fall back to 1.
; 0 = hide the WG label and numeric value.
; 1 = current carried weight only, e.g. WG 75 (default).
; 2 = carried weight / maximum capacity, e.g. WG 75/150.
; 3 = capacity used as a percentage, e.g. WG 50% (can exceed 100%).
;     Displays WG --% if maximum capacity is zero or negative.
; 4 = spare capacity: WG +75 means 75 free, WG -25 means 25 overweight.
;     Displays WG 0 at the limit. Numeric values round to whole numbers.
iWGStatDisplayMode=1
; Show Damage Resistance as a percentage on a separate line beneath DT.
; Enable for setups where DR matters (for example STARS).
bShowDRStat=1

[Position]
; Move the entire stats panel, including its bracket, in HUD units.
; Zero uses the default activation-prompt position.
; Positive X moves right; positive Y moves down.
; Adjust manually to match custom HUD Editor layouts.
fStatsOffsetX=0
fStatsOffsetY=0
; Move the companion health bar, bracket, and name together, in HUD units.
; Zero preserves the default position. Positive X moves right; positive Y moves down.
fHealthBarOffsetX=0
fHealthBarOffsetY=0

[Behavior]
; Seconds the companion health bar panel remains after its last target/timer refresh.
; default = 5.5, the vanilla fEnemyHealthBarTimer game setting default.
fCompanionHealthBarTimer=5.5
